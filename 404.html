<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Northum</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A1626">
  <link rel="icon" href="/assets/brand/svg/northum-icone-app.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    /* Página de erro: ocupa a tela inteira, com o mesmo fundo do topo do site */
    .lost { min-height: 100dvh; padding: 6rem var(--gutter) 4rem; display: grid; align-content: center; justify-items: center; text-align: center; }
    .lost > * { position: relative; }
    .lost img { height: 30px; width: auto; margin-bottom: 3rem; }
    .lost-code { font-family: var(--font-display); font-size: clamp(6rem, 4rem + 14vw, 12rem); font-weight: 700; letter-spacing: -.06em; line-height: .8; color: rgba(212, 168, 87, .22); }
    .lost h1 { margin-top: 1.6rem; font-size: clamp(1.8rem, 1.3rem + 2vw, 2.6rem); }
    .lost .lead { margin-inline: auto; }
    .lost .actions { justify-content: center; }
  </style>
</head>
<body>
  <main class="hero lost">
    <div class="hero-grid" aria-hidden="true"></div>
    <a href="/" aria-label="Northum, página inicial"><img src="/assets/brand/svg/northum-logo-horizontal-fundo-escuro.svg" alt="Northum" width="155" height="30"></a>
    <p class="lost-code" aria-hidden="true">404</p>
    <h1>Esta página não existe</h1>
    <p class="lead">O endereço pode ter mudado ou sido digitado errado. Na página inicial você conhece a Nina, a IA de vendas da Northum.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Ir para a página inicial</a>
      <a class="btn btn-ghost" href="/#demonstracao">Agendar demonstração</a>
    </div>
  </main>
</body>
</html>
